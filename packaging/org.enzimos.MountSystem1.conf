<?xml version="1.0"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- SPDX-License-Identifier: MIT -->
<busconfig>
  <policy user="root">
    <allow own="org.enzimos.MountSystem1"/>
  </policy>
  <!-- Every method checks the caller with polkit (org.enzimos.mount.user-mount). -->
  <policy context="default">
    <allow send_destination="org.enzimos.MountSystem1" send_interface="org.enzimos.MountSystem1"/>
    <allow send_destination="org.enzimos.MountSystem1" send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="org.enzimos.MountSystem1" send_interface="org.freedesktop.DBus.Peer"/>
  </policy>
</busconfig>
